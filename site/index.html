<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Analytics · Yaseen Khatib</title>
<style>
  /* streamerOS "Void & Neon": pure black base, subtle/elevated surfaces, cyan + purple brand, white-alpha borders. */
  :root{
    color-scheme:dark;
    --bg:#000000; --card:#070A0F; --card2:#11161D; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
    --text:#f4f4f5; --mute:#a1a1aa; --dim:#71717a;
    --brand:#22D3EE; --purple:#A855F7; --accent:#22D3EE; --accent-soft:rgba(34,211,238,.10); --accent-line:rgba(34,211,238,.35); --on-accent:#000000;
    --good:#22C55E; --bad:#F87171; --warn:#F59E0B;
    --s1:#0891B2; --s2:#A855F7; --s3:#D97706; --s4:#DB2777; --s5:#2563EB; --s6:#16A34A; --s7:#71717a;
    --inset:inset 0 1px 1px rgba(255,255,255,.05);
    --mono:ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --r:16px; --side:232px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  ::selection{background:rgba(99,102,241,.4);color:#fff}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.20)}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;font-feature-settings:'cv02','cv03','cv04','cv11','tnum';-webkit-font-smoothing:antialiased}
  a{color:var(--brand)} button,select,input{font:inherit;color:inherit}
  :focus-visible{outline:2px solid #38BDF8;outline-offset:2px;border-radius:6px}
  .shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
  aside{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:4px}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px}
  .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--purple));display:grid;place-items:center;color:#000;font-weight:800}
  .brand b{display:block;font-size:15px}.brand span{color:var(--dim);font-size:12px}

  nav.side button:hover{background:var(--card2);color:var(--text)}
  nav.side button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--brand);font-weight:600}
  nav.side svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .side-foot{margin-top:auto;color:var(--dim);font-size:12px;padding:10px;font-family:var(--mono)}
  main{min-width:0;padding:0 28px 56px}
  .top{position:sticky;top:0;z-index:20;margin:0 -28px;padding:16px 28px 12px;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top-row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
  .eyebrow{font:600 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:rgba(34,211,238,.8);margin-bottom:2px}

  .span{color:var(--dim);font-size:12.5px;margin-top:1px}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--mute);font:12px var(--mono);white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none;animation:pg 3s ease-in-out infinite}
  @keyframes pg{0%,100%{box-shadow:0 0 4px rgba(34,197,94,.10)}50%{box-shadow:0 0 14px rgba(34,197,94,.55)}}
  .ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.scroll::-webkit-scrollbar{display:none}
  .pill{flex:none;border:1px solid var(--line);background:var(--card2);color:var(--mute);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
  .pill:hover{color:var(--text);border-color:var(--line2)}
  .pill.on{color:var(--on-accent);background:var(--brand);border-color:var(--brand);font-weight:600}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%;box-shadow:var(--inset)}.seg::-webkit-scrollbar{display:none}
  .seg button{flex:none;border:1px solid transparent;background:none;color:var(--mute);padding:5px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .seg button:hover{color:var(--text)}.seg button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--brand);font-weight:600}

  .msel{display:none}.mtabs{display:none}

  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}

  .sub{color:var(--dim);font-size:12.5px;margin:0 0 10px}

  .kpi.tog{cursor:pointer}.kpi.tog.off{opacity:.5}.kpi.tog.on{box-shadow:var(--inset),0 0 0 1px var(--c,var(--brand))}
  .delta{display:inline-block;font:600 11.5px var(--mono);padding:1px 8px;border-radius:999px}
  .up{background:rgba(34,197,94,.12);color:var(--good)}.down{background:rgba(239,68,68,.14);color:var(--bad)}.flat{background:var(--card2);color:var(--mute)}

  .live{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.live .big{font-size:32px;font-weight:700;letter-spacing:-.02em;margin-right:2px}
  .lp{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 11px}
  .sites{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
  .site{cursor:pointer;transition:border-color .15s,box-shadow .15s}.site:hover{border-color:var(--accent-line);box-shadow:var(--inset),0 0 20px rgba(34,211,238,.12)}

  .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini div{background:var(--card2);border-radius:10px;padding:8px 9px}
  .mini small{display:block;color:var(--dim);font:11px var(--mono)}.mini b{font-size:17px}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 8px}
  .tools input,.tools select{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:14px}.tools input{flex:1;min-width:120px}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
  table{width:100%;border-collapse:collapse;min-width:300px}
  th,td{padding:9px 8px;border-top:1px solid var(--line);text-align:right;vertical-align:top}
  th:first-child,td:first-child{text-align:left;word-break:break-word;min-width:130px}
  th{border-top:0;color:var(--dim);font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;cursor:pointer;user-select:none}
  th:hover{color:var(--text)}th.s{color:var(--brand)}th.s::after{content:" ↓"}th.s.asc::after{content:" ↑"}
  td .bar{display:block;height:3px;border-radius:2px;margin-top:6px;background:var(--brand);opacity:.5}
  .cnt{color:var(--dim);font:12px var(--mono);margin-top:8px}
  .empty{color:var(--dim);padding:16px 0 8px;text-align:center}
  .rank{display:grid;gap:12px}.rank .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px}
  .rank .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rank .vv{color:var(--mute)}
  .rank .track{grid-column:1/-1;height:5px;border-radius:3px;background:var(--card2);overflow:hidden}.rank .fill{height:100%;border-radius:3px;background:var(--brand)}
  .legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--mute);margin-top:8px}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
  .donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.donutwrap svg{width:132px;height:132px;flex:none}
  .axt{fill:var(--dim);font-size:10px;font-family:var(--mono)}.gl{stroke:var(--line)}.dtk{stroke:var(--card2)}.dtx{fill:var(--text)}
  .heat{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px}.heat div{height:26px;border-radius:4px;background:var(--brand)}.hl{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px;font:10px var(--mono);color:var(--dim);margin-top:4px;text-align:center}
  .funnel .f{display:grid;grid-template-columns:130px 1fr 56px;gap:10px;align-items:center;margin:9px 0}.funnel .fb{height:18px;border-radius:5px;background:var(--brand);min-width:3px}
  .field{display:grid;gap:5px;margin:10px 0}.field input,.field select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}
  code{background:var(--card2);border:1px solid var(--line);padding:2px 6px;border-radius:6px;word-break:break-all;font:12.5px var(--mono);color:var(--brand)}
  .btn{background:var(--brand);color:#000;border:0;border-radius:10px;padding:9px 16px;font-weight:650;cursor:pointer}.btn:hover{box-shadow:0 0 20px rgba(34,211,238,.35)}
  .skeleton{height:96px;border-radius:var(--r);background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sh 1.2s infinite;border:1px solid var(--line)}
  @keyframes sh{to{background-position:-200% 0}}
  .ai{font-weight:600}
  @media (max-width:860px){
    .shell{display:block}aside{display:none}
    main{padding:0 14px 48px}
    .top{position:static;margin:0 -14px;padding:12px 14px 10px}
    .top h1{font-size:19px}
    .dsk{display:none}.msel{display:flex}
    .msel select{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:16px}
    .mtabs{display:flex;position:sticky;top:0;z-index:20;margin:0 -14px;padding:8px 14px;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .kpi .v{font-size:25px}.funnel .f{grid-template-columns:96px 1fr 48px}.stampchip{display:none}
  }
  @media (max-width:420px){.card{padding:14px}.grid,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (prefers-reduced-motion:reduce){.dot,.skeleton{animation:none}}
</style>
</head>

</div>
<script>
