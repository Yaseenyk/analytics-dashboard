<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070a10">
<title>Analytics · Yaseen Khatib</title>
<style>
  :root {
    --bg:#070a10; --bg2:#0b1018; --card:#0f1621; --card2:#131c2a; --line:#1c2636; --line2:#27344a;
    --text:#e8eef6; --mute:#8a98ad; --dim:#5d6b80; --cyan:#22d3ee; --violet:#a78bfa; --good:#34d399; --bad:#fb7185; --warn:#fbbf24;
    --r:16px; --side:224px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{margin:0;background:radial-gradient(1200px 500px at 70% -10%,rgba(34,211,238,.07),transparent 60%),radial-gradient(900px 500px at 0% 0%,rgba(167,139,250,.07),transparent 55%),var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;min-height:100vh}
  a{color:var(--cyan)}
  button,select,input{font:inherit;color:inherit}
  .shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
  /* sidebar */
  aside{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(15,22,33,.9),rgba(11,16,24,.9));display:flex;flex-direction:column;gap:6px}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 10px 16px}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--violet));display:grid;place-items:center;color:#05070a;font-weight:800}
  .brand b{display:block;font-size:15px;letter-spacing:.01em}.brand span{color:var(--mute);font-size:12px}
  nav.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;color:var(--mute);cursor:pointer}
  nav.side button:hover{background:var(--card);color:var(--text)}
  nav.side button.on{background:linear-gradient(90deg,rgba(34,211,238,.14),rgba(167,139,250,.10));color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
  nav.side svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .side-foot{margin-top:auto;color:var(--dim);font-size:12px;padding:10px}
  /* main */
  main{min-width:0;padding:0 24px 56px}
  .top{position:sticky;top:0;z-index:20;margin:0 -24px;padding:14px 24px 10px;background:rgba(7,10,16,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top-row{display:flex;align-items:center;gap:12px;justify-content:space-between}
  .top h1{margin:0;font-size:20px;letter-spacing:-.01em}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mute);font-size:12px;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(52,211,153,.18)}
  .scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:10px 0 2px}
  .scroll::-webkit-scrollbar{display:none}
  .pill{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap}
  .pill:hover{color:var(--text);border-color:var(--line2)}
  .pill.on{color:#05070a;background:linear-gradient(90deg,var(--cyan),var(--violet));border-color:transparent;font-weight:600}
  .mtabs{display:none}
  /* content */
  .page{padding-top:18px;display:grid;gap:14px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
  .g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
  .cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
  .card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
  .card h2{margin:0 0 2px;font-size:14px;font-weight:650}
  .sub{color:var(--mute);font-size:12px;margin:0 0 10px}
  .kpi .k{color:var(--mute);font-size:12px;letter-spacing:.02em}
  .kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:2px 0;font-variant-numeric:tabular-nums}
  .kpi svg.sp{display:block;width:100%;height:30px;margin-top:6px}
  .delta{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px}
  .up{background:rgba(52,211,153,.12);color:var(--good)}.down{background:rgba(251,113,133,.12);color:var(--bad)}.flat{background:var(--card);color:var(--mute)}
  .banner{border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.07);color:#f6d58a;border-radius:var(--r);padding:12px 14px}
  .live{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .live .big{font-size:30px;font-weight:700;margin-right:6px}
  .lp{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
  .lp b{font-variant-numeric:tabular-nums}
  .sites{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
  .site{cursor:pointer;transition:border-color .15s,transform .15s}.site:hover{border-color:var(--cyan);transform:translateY(-1px)}
  .site h3{margin:0;font-size:15px}.site .host{color:var(--dim);font-size:12px;margin-bottom:10px}
  .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini div{background:var(--bg2);border-radius:10px;padding:8px}
  .mini small{display:block;color:var(--dim);font-size:11px}.mini b{font-size:17px;font-variant-numeric:tabular-nums}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
  table{width:100%;border-collapse:collapse;min-width:300px}
  th,td{padding:8px 8px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top}
  th:first-child,td:first-child{text-align:left;word-break:break-word;min-width:130px}
  th{border-top:0;color:var(--dim);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
  td .bar{display:block;height:3px;border-radius:3px;margin-top:5px;background:linear-gradient(90deg,var(--cyan),var(--violet))}
  .more{margin-top:8px}.more button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--mute);cursor:pointer}
  .empty{color:var(--mute);padding:14px 0 6px;text-align:center}
  .rank{display:grid;gap:10px}.rank .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
  .rank .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rank .vv{font-variant-numeric:tabular-nums;color:var(--mute)}
  .rank .track{grid-column:1/-1;height:5px;border-radius:4px;background:var(--bg2);overflow:hidden}.rank .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--violet))}
  .legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin-top:6px}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
  .donutwrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.donutwrap svg{width:132px;height:132px;flex:none}
  .heat{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px}.heat div{height:26px;border-radius:5px}.hl{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px;font-size:10px;color:var(--dim);margin-top:4px;text-align:center}
  .funnel .f{display:grid;grid-template-columns:130px 1fr 56px;gap:10px;align-items:center;margin:8px 0}.funnel .fb{height:20px;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--violet));min-width:3px}
  .field{display:grid;gap:5px;margin:10px 0}.field input,.field select{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:10px;font-size:16px}
  code{background:var(--bg2);padding:2px 6px;border-radius:6px;word-break:break-all;font-size:12.5px}
  .btn{background:linear-gradient(90deg,var(--cyan),var(--violet));color:#05070a;border:0;border-radius:10px;padding:9px 16px;font-weight:650;cursor:pointer}
  .skeleton{height:90px;border-radius:var(--r);background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  @media (max-width:860px){
    .shell{display:block}
    aside{display:none}
    main{padding:0 14px 48px}
    .top{margin:0 -14px;padding:12px 14px 8px}
    .top h1{font-size:18px}
    .mtabs{display:flex}
    .kpi .v{font-size:24px}
    .funnel .f{grid-template-columns:96px 1fr 48px}
    .stampchip{display:none}
  }
  @media (max-width:420px){.card{padding:13px}.grid,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><div class="logo">A</div><div><b>Analytics</b><span>Yaseen Khatib</span></div></div>
    <nav class="side" id="side"></nav>
    <div class="side-foot" id="foot"></div>
  </aside>
  <main>
    <div class="top">
      <div class="top-row"><h1 id="title">Overview</h1><div style="display:flex;gap:8px;align-items:center"><span class="chip"><span class="dot"></span><span id="stamp">Loading</span></span><span class="chip stampchip">Last 28 days</span></div></div>
      <div class="scroll" id="sites"></div>
      <div class="scroll mtabs" id="mtabs"></div>
    </div>
    <div class="page" id="page"><div class="skeleton"></div><div class="skeleton"></div></div>
  </main>
</div>

<script>
(function () {
'use strict';
var SITES = { 'streamerosai.com': 'streamerOS', 'yk.streamerosai.com': 'Portfolio', 'fitrank.streamerosai.com': 'FitRank', 'campus.streamerosai.com': 'DefendIt', 'spotai.streamerosai.com': 'SpotAI' };
var STREAMS = { 'Streamerosai': 'streamerOS', 'Yaseen Khatib': 'Portfolio', 'Fit Rank': 'FitRank', 'Defend It': 'DefendIt', 'Spot AI': 'SpotAI' };
var GSCP = function (h) { return 'https://' + h + '/'; };
var COLORS = ['#22d3ee', '#a78bfa', '#34d399', '#fbbf24', '#fb7185', '#60a5fa', '#fb923c'];
var ICON = {
  Overview: '<path d="M3 12l9-8 9 8M5 10v10h14V10"/>', Traffic: '<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>', Pages: '<path d="M7 3h8l4 4v14H7zM15 3v4h4"/>',
  Conversions: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>', Audience: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-4 3.2-6 6.5-6s6 2 6.5 6M17 11a3 3 0 100-6M18.5 14c2 .5 3 2.5 3 5"/>',
  Search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', Live: '<path d="M2 12h4l3-8 4 16 3-8h6"/>', Tools: '<path d="M14 6l4 4-9 9H5v-4zM13 7l4 4"/>'
};
var TABS = [['Overview', 'Overview'], ['Traffic', 'Traffic sources'], ['Pages', 'Pages'], ['Conversions', 'Conversions'], ['Audience', 'Audience'], ['Search', 'Search'], ['Live', 'Live'], ['Tools', 'Tools']];
var D = null, state = { site: 'all', tab: 'Overview' };
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function n(x) { x = +x || 0; var a = Math.abs(x); return a >= 1e6 ? (x / 1e6).toFixed(1) + 'M' : a >= 1e4 ? (x / 1e3).toFixed(1) + 'k' : Math.round(x).toLocaleString('en-IN'); }
function pct(a, b) { return b > 0 ? (100 * a / b).toFixed(1) + '%' : '–'; }
function dur(s) { s = Math.round(s || 0); return s >= 60 ? Math.floor(s / 60) + 'm ' + (s % 60) + 's' : s + 's'; }
function label(h) { return SITES[h] || h; }
function ico(k) { return '<svg viewBox="0 0 24 24">' + (ICON[k] || '') + '</svg>'; }

// ---- data helpers -------------------------------------------------------------
function rep(name) { return D.reports[name] || { dims: [], mets: [], rows: [] }; }
function isReal(h) { return h === undefined || !!SITES[h]; }
function filtered(r) { var hi = r.dims.indexOf('hostName'); return r.rows.filter(function (row) { return hi < 0 || (state.site === 'all' ? isReal(row[hi]) : row[hi] === state.site); }); }
function group(r, idx, rows) {
  rows = rows || filtered(r); var nd = r.dims.length, map = {}, out = [];
  rows.forEach(function (row) { var k = idx.map(function (i) { return row[i]; }), id = k.join('\u0001'), o = map[id];
    if (!o) { o = map[id] = { k: k, m: r.mets.map(function () { return 0; }) }; out.push(o); } r.mets.forEach(function (_, j) { o.m[j] += row[nd + j]; }); });
  return out.sort(function (a, b) { return b.m[0] - a.m[0]; });
}
function ix(r, nm) { return r.dims.indexOf(nm); }
function sum(r, met, rows) { var j = r.mets.indexOf(met), nd = r.dims.length; return (rows || filtered(r)).reduce(function (s, row) { return s + row[nd + j]; }, 0); }
function hasGA() { return rep('totals').rows.length > 0; }
// Search Console rows for the selected site(s).
function gscList() {
  var out = [], hosts = state.site === 'all' ? Object.keys(SITES) : [state.site];
  hosts.forEach(function (h) { var s = D.search[GSCP(h)]; if (s && s.ok) out.push({ host: h, s: s }); });
  return out;
}
function gscMissing() { var hosts = state.site === 'all' ? Object.keys(SITES) : [state.site]; return hosts.filter(function (h) { var s = D.search[GSCP(h)]; return !(s && s.ok); }); }
function gscTotals() { var c = 0, i = 0, pw = 0; gscList().forEach(function (x) { var t = x.s.total; if (t) { c += t[0]; i += t[1]; pw += t[3] * t[1]; } }); return { clicks: c, impr: i, ctr: i ? 100 * c / i : 0, pos: i ? pw / i : 0 }; }
// Merge Search Console rows (key count nk) across sites; clicks and impressions add, CTR and position recomputed.
function gscMerge(kind, nk) {
  var map = {}, out = [];
  gscList().forEach(function (x) { (x.s[kind] || []).forEach(function (r) { var k = r.slice(0, nk).join('\u0001'), o = map[k];
    if (!o) { o = map[k] = { k: r.slice(0, nk), c: 0, i: 0, pw: 0 }; out.push(o); } var c = r[nk], im = r[nk + 1]; o.c += c; o.i += im; o.pw += r[nk + 3] * im; }); });
  return out.map(function (o) { return o.k.concat([o.c, o.i, o.i ? +(100 * o.c / o.i).toFixed(2) : 0, o.i ? +(o.pw / o.i).toFixed(1) : 0]); }).sort(function (a, b) { return b[nk] - a[nk] || b[nk + 1] - a[nk + 1]; });
}

// ---- building blocks -------------------------------------------------------------
function delta(cur, prev) { if (!prev) return ''; var p = 100 * (cur - prev) / prev; return '<span class="delta ' + (Math.abs(p) < 1 ? 'flat' : p > 0 ? 'up' : 'down') + '">' + (p > 0 ? '▲ ' : p < 0 ? '▼ ' : '') + Math.abs(p).toFixed(0) + '%</span>'; }
function spark(vals, color) {
  if (!vals || vals.length < 2) return ''; var W = 100, H = 30, mx = Math.max.apply(null, vals) || 1, mn = Math.min.apply(null, vals);
  var pts = vals.map(function (v, i) { return (i * W / (vals.length - 1)).toFixed(1) + ',' + (H - 3 - (H - 6) * (v - mn) / ((mx - mn) || 1)).toFixed(1); });
  var id = 'g' + Math.random().toString(36).slice(2, 7);
  return '<svg class="sp" viewBox="0 0 100 30" preserveAspectRatio="none"><defs><linearGradient id="' + id + '" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="' + color + '" stop-opacity=".35"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs><polygon fill="url(#' + id + ')" points="0,30 ' + pts.join(' ') + ' 100,30"/><polyline fill="none" stroke="' + color + '" stroke-width="1.6" vector-effect="non-scaling-stroke" points="' + pts.join(' ') + '"/></svg>';
}
function kpi(k, v, d, sp, color) { return '<div class="card kpi"><div class="k">' + esc(k) + '</div><div class="v">' + v + '</div>' + (d || '') + (sp ? spark(sp, color || COLORS[0]) : '') + '</div>'; }
function empty(msg) { return '<div class="empty">' + esc(msg || 'No data yet.') + '</div>'; }
function table(title, cols, rows, o) {
  o = o || {}; var max = o.max || 10, id = 't' + Math.random().toString(36).slice(2, 8);
  var head = '<div class="card"><h2>' + esc(title) + '</h2>' + (o.note ? '<p class="sub">' + esc(o.note) + '</p>' : '');
  if (!rows.length) return head + empty(o.empty || (hasGA() ? 'Nothing here yet.' : 'GA4 is still processing the new tags; this fills in within about a day.')) + '</div>';
  var top = o.bar != null ? Math.max.apply(null, rows.map(function (r) { return +r[o.bar] || 0; })) || 1 : 0;
  var body = rows.map(function (r, i) { return '<tr' + (i >= max ? ' class="hid" data-x="' + id + '" style="display:none"' : '') + '>' + r.map(function (c, j) {
    return '<td>' + esc(c) + (j === 0 && top ? '<span class="bar" style="width:' + Math.max(3, 100 * (+r[o.bar] || 0) / top) + '%"></span>' : '') + '</td>'; }).join('') + '</tr>'; }).join('');
  return head + '<div class="tw"><table><thead><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
    (rows.length > max ? '<div class="more"><button data-more="' + id + '">Show all ' + rows.length + '</button></div>' : '') + '</div>';
}
function rank(title, items, o) {
  o = o || {}; var mx = Math.max.apply(null, items.map(function (i) { return i[1]; })) || 1;
  return '<div class="card"><h2>' + esc(title) + '</h2>' + (o.note ? '<p class="sub">' + esc(o.note) + '</p>' : '') + (items.length ? '<div class="rank" style="margin-top:10px">' + items.slice(0, o.max || 7).map(function (i) {
    return '<div class="row"><span class="nm" title="' + esc(i[0]) + '">' + esc(i[0]) + '</span><span class="vv">' + esc(i[2] != null ? i[2] : n(i[1])) + '</span><div class="track"><div class="fill" style="width:' + Math.max(2, 100 * i[1] / mx) + '%"></div></div></div>'; }).join('') + '</div>' : empty(o.empty || 'No data yet.')) + '</div>';
}
function donut(title, items) {
  var tot = items.reduce(function (s, i) { return s + i[1]; }, 0);
  if (!tot) return '<div class="card"><h2>' + esc(title) + '</h2>' + empty('No data yet.') + '</div>';
  var top = items.slice(0, 5), rest = items.slice(5).reduce(function (s, i) { return s + i[1]; }, 0); if (rest) top.push(['Other', rest]);
  var off = 25, arcs = top.map(function (it, i) { var p = 100 * it[1] / tot, a = '<circle r="15.9155" cx="21" cy="21" fill="none" stroke="' + COLORS[i % COLORS.length] + '" stroke-width="5" stroke-dasharray="' + p.toFixed(2) + ' ' + (100 - p).toFixed(2) + '" stroke-dashoffset="' + off.toFixed(2) + '"><title>' + esc(it[0]) + ': ' + n(it[1]) + '</title></circle>'; off -= p; return a; }).join('');
  return '<div class="card"><h2>' + esc(title) + '</h2><div class="donutwrap" style="margin-top:8px"><svg viewBox="0 0 42 42" role="img"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="#131c2a" stroke-width="5"/>' + arcs + '<text x="21" y="22.5" text-anchor="middle" font-size="6" fill="#e8eef6" font-weight="700">' + n(tot) + '</text></svg><div class="legend" style="flex-direction:column;margin:0">' +
    top.map(function (it, i) { return '<span><i style="background:' + COLORS[i % COLORS.length] + '"></i>' + esc(it[0]) + ' · ' + pct(it[1], tot) + '</span>'; }).join('') + '</div></div></div>';
}
function area(title, series, sub) {
  var W = 640, H = 200, P = { l: 38, r: 10, t: 10, b: 22 }, dates = {};
  series.forEach(function (s) { s.pts.forEach(function (p) { dates[p[0]] = 1; }); });
  var xs = Object.keys(dates).sort(); if (!xs.length) return '<div class="card"><h2>' + esc(title) + '</h2>' + empty(sub || 'No data yet.') + '</div>';
  var mx = 1; series.forEach(function (s) { s.pts.forEach(function (p) { mx = Math.max(mx, p[1]); }); });
  var X = function (i) { return P.l + (xs.length > 1 ? i * (W - P.l - P.r) / (xs.length - 1) : (W - P.l - P.r) / 2); }, Y = function (v) { return P.t + (H - P.t - P.b) * (1 - v / mx); };
