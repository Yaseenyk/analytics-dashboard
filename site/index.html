<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Analytics · Yaseen Khatib</title>
<style>
  :root { --bg:#05070a; --panel:#0d1117; --panel2:#111823; --line:#1f2937; --text:#e6edf3; --mute:#8b98a9; --cyan:#22d3ee; --violet:#a78bfa; --good:#34d399; --bad:#f87171; --warn:#fbbf24; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  a { color:var(--cyan); }
  .wrap { max-width:1280px; margin:0 auto; padding:0 16px 64px; }
  header { position:sticky; top:0; z-index:5; background:rgba(5,7,10,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .bar { max-width:1280px; margin:0 auto; padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }
  .bar h1 { font-size:16px; margin:0 8px 0 0; }
  select, input, button { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--cyan); }
  .tabs { display:flex; flex-wrap:wrap; gap:4px; }
  .tabs button { border-color:transparent; background:transparent; color:var(--mute); }
  .tabs button.on { background:var(--panel2); color:var(--text); border-color:var(--line); }
  .stamp { margin-left:auto; color:var(--mute); font-size:12px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); margin:16px 0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card .k { color:var(--mute); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .card .v { font-size:26px; font-weight:650; margin-top:2px; font-variant-numeric:tabular-nums; }
  .d { font-size:12px; } .up { color:var(--good); } .down { color:var(--bad); } .flat { color:var(--mute); }
  .cols { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(420px,1fr)); }
  @media (max-width:520px) { .cols { grid-template-columns:1fr; } }
  h2 { font-size:15px; margin:0 0 8px; } h3 { font-size:13px; margin:0 0 6px; color:var(--mute); font-weight:600; }
  .note { color:var(--mute); font-size:12px; margin:4px 0 0; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:6px 8px; border-top:1px solid var(--line); text-align:right; font-variant-numeric:tabular-nums; vertical-align:top; }
  th:first-child, td:first-child { text-align:left; word-break:break-word; }
  th { color:var(--mute); font-weight:600; font-size:12px; border-top:0; }
  .bar1 { display:block; height:3px; background:linear-gradient(90deg,var(--cyan),var(--violet)); border-radius:2px; margin-top:3px; }
  .more { margin-top:6px; font-size:12px; }
  .empty { color:var(--mute); padding:12px 0; }
  .lock { max-width:380px; margin:18vh auto; padding:0 16px; text-align:center; }
  .lock input { width:100%; margin:12px 0; padding:10px; } .lock .err { color:var(--bad); min-height:20px; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--mute); margin-top:4px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  .heat { display:grid; grid-template-columns:34px repeat(24,1fr); gap:2px; font-size:10px; color:var(--mute); }
  .heat div { height:18px; border-radius:3px; }
  .funnel div { display:flex; align-items:center; gap:10px; margin:6px 0; }
  .funnel .fb { height:22px; border-radius:5px; background:linear-gradient(90deg,var(--cyan),var(--violet)); min-width:2px; }
  .field { display:grid; gap:4px; margin:8px 0; } .field input, .field select { width:100%; }
  code { background:var(--panel2); padding:1px 5px; border-radius:4px; word-break:break-all; }
  .hidden { display:none; }
</style>
</head>
<body>
<div id="lock" class="lock">
  <h1>Analytics</h1>
  <p class="note">The data on this page is encrypted. Enter the passphrase to read it.</p>
  <form id="lockform"><input id="pass" type="password" placeholder="Passphrase" autocomplete="current-password" autofocus><button>Unlock</button><div class="err" id="lockerr"></div></form>
</div>

<div id="app" class="hidden">
<header>
  <div class="bar">
    <h1>Analytics</h1>
    <select id="site" aria-label="Site"></select>
    <nav class="tabs" id="tabs"></nav>
    <span class="stamp" id="stamp"></span>
  </div>
</header>
<main class="wrap" id="main"></main>
</div>

<script>
(function () {
'use strict';
var SITES = {
  'streamerosai.com': 'streamerOS', 'yk.streamerosai.com': 'Portfolio', 'fitrank.streamerosai.com': 'FitRank',
  'campus.streamerosai.com': 'DefendIt', 'spotai.streamerosai.com': 'SpotAI'
};
var STREAMS = { 'Streamerosai': 'streamerOS', 'Yaseen Khatib': 'Portfolio', 'Fit Rank': 'FitRank', 'Defend It': 'DefendIt', 'Spot AI': 'SpotAI' };
var COLORS = ['#22d3ee', '#a78bfa', '#34d399', '#fbbf24', '#f472b6', '#60a5fa', '#fb923c'];
var TABS = ['Overview', 'Acquisition', 'Pages', 'Conversions', 'Audience', 'Search', 'Realtime', 'Tools'];
var D = null, state = { site: 'all', tab: 'Overview', gsc: null };
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function n(x) { x = +x || 0; return Math.abs(x) >= 1e6 ? (x / 1e6).toFixed(1) + 'M' : Math.abs(x) >= 1e4 ? (x / 1e3).toFixed(1) + 'k' : Math.round(x).toLocaleString('en-IN'); }
function pct(a, b) { return b > 0 ? (100 * a / b).toFixed(1) + '%' : '–'; }
function dur(sec) { sec = Math.round(sec || 0); return sec >= 60 ? Math.floor(sec / 60) + 'm ' + (sec % 60) + 's' : sec + 's'; }
function label(host) { return SITES[host] || host; }

// ---- decrypt -------------------------------------------------------------
function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
async function decrypt(pass) {
  var res = await fetch('data.json?t=' + Date.now()); var j = await res.json();
  var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(j.salt), iterations: j.iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(j.iv) }, key, b64(j.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

// ---- data helpers ----------------------------------------------------------
function rep(name) { return D.reports[name] || { dims: [], mets: [], rows: [] }; }
function hostIdx(r) { return r.dims.indexOf('hostName'); }
function filtered(r) {
  var hi = hostIdx(r);
  return r.rows.filter(function (row) { return hi < 0 || state.site === 'all' ? isReal(row[hi]) : row[hi] === state.site; });
}
function isReal(h) { return h === undefined || !!SITES[h]; }
// Sum metrics grouped by the chosen dimension indexes. Returns [{k:[...], m:[...]}] sorted by first metric.
function group(r, dimIdx, rowsIn) {
  var rows = rowsIn || filtered(r), nd = r.dims.length, map = {}, out = [];
  rows.forEach(function (row) {
    var k = dimIdx.map(function (i) { return row[i]; }), id = k.join('\u0001');
    var o = map[id]; if (!o) { o = map[id] = { k: k, m: r.mets.map(function () { return 0; }) }; out.push(o); }
    r.mets.forEach(function (_, j) { o.m[j] += row[nd + j]; });
  });
  return out.sort(function (a, b) { return b.m[0] - a.m[0]; });
}
function di(r, names) { return names.map(function (nm) { return r.dims.indexOf(nm); }); }
function mi(r, nm) { return r.mets.indexOf(nm); }
function sumMet(r, nm, rows) { var j = mi(r, nm), nd = r.dims.length; return (rows || filtered(r)).reduce(function (s, row) { return s + row[nd + j]; }, 0); }

// ---- ui bits -----------------------------------------------------------------
function delta(cur, prev, invert) {
  if (!prev) return '<span class="d flat">no prior data</span>';
  var p = 100 * (cur - prev) / prev, up = invert ? p < 0 : p > 0;
  return '<span class="d ' + (Math.abs(p) < 1 ? 'flat' : up ? 'up' : 'down') + '">' + (p > 0 ? '+' : '') + p.toFixed(0) + '% vs prior ' + D.days + 'd</span>';
}
function card(k, v, sub) { return '<div class="card"><div class="k">' + esc(k) + '</div><div class="v">' + v + '</div>' + (sub || '') + '</div>'; }
function table(title, cols, rows, opt) {
  opt = opt || {}; var max = opt.max || 12, id = 't' + Math.random().toString(36).slice(2, 8);
  if (!rows.length) return '<div class="card"><h2>' + esc(title) + '</h2><div class="empty">' + (opt.empty || 'No data yet. GA4 reports fill in within about a day of the tags going live.') + '</div></div>';
  var top = opt.bar != null ? Math.max.apply(null, rows.map(function (r) { return +r[opt.bar] || 0; })) : 0;
  function tr(r, i) {
    return '<tr' + (i >= max ? ' data-x="' + id + '" class="hidden"' : '') + '>' + r.map(function (c, j) {
      var bar = j === 0 && top ? '<span class="bar1" style="width:' + Math.max(2, 100 * (+r[opt.bar] || 0) / top) + '%"></span>' : '';
      return '<td>' + (typeof c === 'string' && c.charAt(0) === '\u0000' ? c.slice(1) : esc(c)) + bar + '</td>';
    }).join('') + '</tr>';
  }
  return '<div class="card"><h2>' + esc(title) + '</h2>' + (opt.note ? '<p class="note">' + esc(opt.note) + '</p>' : '') +
    '<table><thead><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.map(tr).join('') + '</tbody></table>' +
    (rows.length > max ? '<div class="more"><button data-more="' + id + '">Show all ' + rows.length + '</button></div>' : '') + '</div>';
}
function lineChart(series, opt) {
  opt = opt || {}; var W = 640, H = 190, P = { l: 36, r: 8, t: 8, b: 20 };
  var dates = {}; series.forEach(function (s) { s.pts.forEach(function (p) { dates[p[0]] = 1; }); });
  var xs = Object.keys(dates).sort(); if (!xs.length) return '<div class="card"><h2>' + esc(opt.title || '') + '</h2><div class="empty">No data yet.</div></div>';
  var max = 1; series.forEach(function (s) { s.pts.forEach(function (p) { max = Math.max(max, p[1]); }); });
  var x = function (i) { return P.l + (xs.length > 1 ? i * (W - P.l - P.r) / (xs.length - 1) : 0); }, y = function (v) { return P.t + (H - P.t - P.b) * (1 - v / max); };
  var g = '';
  for (var t = 0; t <= 3; t++) { var v = max * t / 3; g += '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#1f2937"/><text x="' + (P.l - 4) + '" y="' + (y(v) + 3) + '" fill="#8b98a9" font-size="10" text-anchor="end">' + n(v) + '</text>'; }
  [0, Math.floor(xs.length / 2), xs.length - 1].forEach(function (i) { if (xs[i]) g += '<text x="' + x(i) + '" y="' + (H - 4) + '" fill="#8b98a9" font-size="10" text-anchor="middle">' + esc(String(xs[i]).replace(/^(\d{4})(\d{2})(\d{2})$/, '$2-$3')) + '</text>'; });
  var lines = series.map(function (s, si) {
    var m = {}; s.pts.forEach(function (p) { m[p[0]] = p[1]; });
    var d = xs.map(function (dt, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(m[dt] || 0).toFixed(1); }).join(' ');
    return '<path d="' + d + '" fill="none" stroke="' + COLORS[si % COLORS.length] + '" stroke-width="2"/>';
  }).join('');
  var lg = series.length > 1 ? '<div class="legend">' + series.map(function (s, si) { return '<span><i style="background:' + COLORS[si % COLORS.length] + '"></i>' + esc(s.name) + '</span>'; }).join('') + '</div>' : '';
  return '<div class="card"><h2>' + esc(opt.title || '') + '</h2><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + esc(opt.title || 'chart') + '">' + g + lines + '</svg>' + lg + '</div>';
}
function dailySeries(r, metric, extraFilter) {
  var hi = hostIdx(r), di0 = r.dims.indexOf('date'), j = mi(r, metric), nd = r.dims.length, by = {};
  filtered(r).forEach(function (row) { if (extraFilter && !extraFilter(row)) return; var k = state.site === 'all' ? label(row[hi]) : label(state.site); (by[k] = by[k] || {})[row[di0]] = (by[k][row[di0]] || 0) + row[nd + j]; });
  return Object.keys(by).map(function (k) { return { name: k, pts: Object.keys(by[k]).map(function (d) { return [d, by[k][d]]; }) }; });
}

// ---- tabs ------------------------------------------------------------------
var view = {};
view.Overview = function () {
  var t = rep('totals'), p = rep('totalsPrev'), h = '';
  var S = function (r, nm) { return sumMet(r, nm); };
  var ses = S(t, 'sessions'), pses = S(p, 'sessions'), usr = S(t, 'activeUsers'), key = S(t, 'keyEvents'), eng = S(t, 'engagedSessions');
  h += '<div class="grid">' +
    card('Sessions', n(ses), delta(ses, pses)) + card('Users', n(usr), delta(usr, S(p, 'activeUsers'))) + card('New users', n(S(t, 'newUsers')), delta(S(t, 'newUsers'), S(p, 'newUsers'))) +
    card('Page views', n(S(t, 'screenPageViews')), delta(S(t, 'screenPageViews'), S(p, 'screenPageViews'))) + card('Engaged sessions', pct(eng, ses), '<span class="d flat">' + n(eng) + ' sessions</span>') +
    card('Time per user', dur(S(t, 'userEngagementDuration') / (usr || 1)), '<span class="d flat">engagement time</span>') +
    card('Key events', n(key), delta(key, S(p, 'keyEvents'))) + card('Key events per session', pct(key, ses), '<span class="d flat">leads, WhatsApp, downloads</span>') + '</div>';
  h += '<div class="cols">' + lineChart(dailySeries(rep('daily'), 'sessions'), { title: 'Sessions per day' }) + lineChart(dailySeries(rep('daily'), 'keyEvents'), { title: 'Key events per day' }) + '</div>';
  // Per-site comparison
  var hi = hostIdx(t), nd = t.dims.length, rows = t.rows.filter(function (r) { return isReal(r[hi]); }).map(function (r) {
    var pr = p.rows.filter(function (q) { return q[hostIdx(p)] === r[hi]; })[0];
    var ps = pr ? pr[p.dims.length + mi(p, 'sessions')] : 0, s = r[nd + mi(t, 'sessions')];
    return [label(r[hi]), s, r[nd + mi(t, 'activeUsers')], r[nd + mi(t, 'screenPageViews')], pct(r[nd + mi(t, 'engagedSessions')], s), r[nd + mi(t, 'keyEvents')], '\u0000' + delta(s, ps)];
  }).sort(function (a, b) { return b[1] - a[1]; });
  h += '<div class="cols">' + table('Sites compared', ['Site', 'Sessions', 'Users', 'Views', 'Engaged', 'Key events', 'Trend'], rows, { bar: 1, max: 10 }) +
    table('Top channels', ['Channel', 'Sessions', 'Users', 'Key events'], group(rep('channels'), [1]).map(function (g) { return [g.k[0], g.m[0], g.m[1], g.m[2]]; }), { bar: 1 }) + '</div>';
  var rt = rep('rtStreams');
  h += '<p class="note">Last 28 days, Google Analytics 4. Users are summed per row, so the same person on two sites counts twice. Live now: ' + n(rt.rows.reduce(function (s, r) { return s + r[1]; }, 0)) + ' active users.</p>';
  return h;
};
view.Acquisition = function () {
  var h = '<div class="cols">';
  h += table('Source / medium', ['Source / medium', 'Sessions', 'Users', 'Key events', 'Engaged'], group(rep('sourceMedium'), [1]).map(function (g) { return [g.k[0], g.m[0], g.m[1], g.m[2], pct(g.m[3], g.m[0])]; }), { bar: 1, max: 15 });
  h += table('Channels', ['Channel', 'Sessions', 'Users', 'Key events'], group(rep('channels'), [1]).map(function (g) { return [g.k[0], g.m[0], g.m[1], g.m[2]]; }), { bar: 1 });
  h += table('Campaigns (UTM and ?ref= tags)', ['Campaign', 'Source / medium', 'Sessions', 'Key events'], group(rep('campaigns'), [1, 2]).filter(function (g) { return g.k[0] !== '(not set)' && g.k[0] !== '(direct)'; }).map(function (g) { return [g.k[0], g.k[1], g.m[0], g.m[2]]; }), { bar: 2, empty: 'No tagged campaigns yet. Use the UTM builder on the Tools tab, or add ?ref=whatsapp to shared links.' });
  h += table('Where new users first came from', ['First source / medium', 'Campaign', 'New users', 'Key events'], group(rep('firstTouch'), [1, 2]).map(function (g) { return [g.k[0], g.k[1], g.m[0], g.m[2]]; }), { bar: 2, max: 15, note: 'First touch: the source that brought a person the first time, not the latest visit.' });
  h += table('Referring pages', ['Referrer', 'Views', 'Users'], group(rep('referrers'), [1]).filter(function (g) { return g.k[0] && g.k[0] !== '(not set)'; }).map(function (g) { return [g.k[0], g.m[0], g.m[1]]; }), { bar: 1, max: 15 });
  h += table('UTM content and term', ['Content', 'Term', 'Sessions', 'Key events'], group(rep('campaignContent'), [1, 2]).filter(function (g) { return g.k[0] !== '(not set)' || g.k[1] !== '(not set)'; }).map(function (g) { return [g.k[0], g.k[1], g.m[0], g.m[1]]; }), { empty: 'No utm_content or utm_term traffic yet.' });
  return h + '</div>';
};
view.Pages = function () {
  var h = '<div class="cols">';
  h += table('Top pages', ['Page', 'Views', 'Users', 'Time on page', 'Key events'], group(rep('pages'), [1]).map(function (g) { return [g.k[0], g.m[0], g.m[1], dur(g.m[2] / (g.m[1] || 1)), g.m[3]]; }), { bar: 1, max: 20 });
  h += table('Landing pages (where visits start)', ['Landing page', 'Sessions', 'Engaged', 'Key events', 'Per session'], group(rep('landing'), [1]).map(function (g) { return [g.k[0], g.m[0], pct(g.m[1], g.m[0]), g.m[2], pct(g.m[2], g.m[0])]; }), { bar: 1, max: 20 });
  h += table('How visitors arrive: landing page by source', ['Landing page', 'Source / medium', 'Sessions', 'Key events'], group(rep('landingSource'), [1, 2]).map(function (g) { return [g.k[0], g.k[1], g.m[0], g.m[1]]; }), { bar: 2, max: 20, note: 'The closest GA4 allows to a journey: entry page, source and whether it ended in a key event.' });
  h += table('Which pages lead to key events', ['Page', 'Key event', 'Count'], group(rep('keyEventsByPage'), [2, 1]).map(function (g) { return [g.k[0], g.k[1], g.m[0]]; }), { bar: 2, max: 20 });
  return h + '</div>';
};
view.Conversions = function () {
  var ev = rep('events'), keys = D.keyEvents, h = '';
  var cnt = {}; group(ev, [1]).forEach(function (g) { cnt[g.k[0]] = g.m[0]; });
  var leads = cnt.generate_lead || 0, ses = sumMet(rep('totals'), 'sessions'), eng = sumMet(rep('totals'), 'engagedSessions'), key = sumMet(rep('totals'), 'keyEvents');
  h += '<div class="grid">' + keys.map(function (k) { return card(k.replace(/_/g, ' '), n(cnt[k] || 0)); }).join('') + '</div>';
  h += '<div class="cols"><div class="card"><h2>Funnel</h2><div class="funnel">' + [['Sessions', ses], ['Engaged sessions', eng], ['Key events', key], ['Leads (forms and sign-ups)', leads]].map(function (f) {
    return '<div><span style="width:150px;color:var(--mute)">' + esc(f[0]) + '</span><span class="fb" style="width:' + Math.max(1, 100 * f[1] / (ses || 1)) * 0.6 + '%"></span><b>' + n(f[1]) + '</b></div>'; }).join('') +
    '</div><p class="note">Key events can fire more than once per session, so that bar can exceed the engaged bar.</p></div>' +
    lineChart(dailySeries(rep('keyEventsDaily'), 'eventCount'), { title: 'Key events per day' }) + '</div><div class="cols">';
  h += table('Did they sign up? Leads by first-touch source', ['First source', 'Medium', 'Campaign', 'Form', 'Leads'], group(rep('leadsFirstTouch'), [1, 2, 3, 4]).map(function (g) { return [g.k[0], g.k[1], g.k[2], g.k[3], g.m[0]]; }), { bar: 4, max: 15, note: 'Needs the new tag: counts start from the first lead after 4 Nov 2026.' });
  h += table('All key events by first-touch source', ['Event', 'First source', 'Medium', 'Count'], group(rep('eventsFirstTouch'), [1, 2, 3]).map(function (g) { return [g.k[0], g.k[1], g.k[2], g.m[0]]; }), { bar: 3, max: 15 });
  h += table('Key events by session source', ['Event', 'Source / medium', 'Count'], group(rep('keyEventsBySource'), [1, 2]).map(function (g) { return [g.k[0], g.k[1], g.m[0]]; }), { bar: 2, max: 15 });
  h += table('Which button or link', ['Event', 'Button / link text', 'Count'], group(rep('ctaText'), [1, 2]).filter(function (g) { return g.k[1] && g.k[1] !== '(not set)'; }).map(function (g) { return [g.k[0], g.k[1], g.m[0]]; }), { bar: 2, max: 15 });
  h += table('Forms', ['Event', 'Form', 'Count'], group(rep('forms'), [1, 2]).map(function (g) { return [g.k[0], g.k[1], g.m[0]]; }), { bar: 2 });
  h += table('All events', ['Event', 'Count', 'Users'], group(ev, [1]).map(function (g) { return [g.k[0], g.m[0], g.m[1]]; }), { bar: 1, max: 15 });
  return h + '</div>';
};
view.Audience = function () {
  var h = '<div class="cols">';
  var two = function (name, dimName, title) { var r = rep(name), i = di(r, [dimName])[0]; return table(title, [title, 'Sessions', 'Key events'], group(r, [i]).map(function (g) { return [g.k[0], g.m[0], g.m[1]]; }), { bar: 1, max: 10 }); };
  h += two('countries', 'country', 'Country') + two('devices', 'deviceCategory', 'Device') + two('browsers', 'browser', 'Browser') + two('os', 'operatingSystem', 'Operating system') + two('languages', 'language', 'Language') + two('newReturning', 'newVsReturning', 'New vs returning');
  var c = rep('cities'); h += table('Cities', ['City', 'Country', 'Sessions', 'Key events'], group(c, [2, 1]).map(function (g) { return [g.k[0], g.k[1], g.m[0], g.m[1]]; }), { bar: 2, max: 12 });
  // heatmap weekday x hour needs a joint report; we only have the two marginals, so show each as bars.
  var wd = group(rep('weekday'), [1]), names = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], wmap = {}; wd.forEach(function (g) { wmap[g.k[0]] = g.m[0]; });
  h += table('Day of week', ['Day', 'Sessions'], names.map(function (nm, i) { return [nm, wmap[i] || 0]; }), { bar: 1, max: 7 });
  var hr = group(rep('hour'), [1]), hmap = {}, mx = 1; hr.forEach(function (g) { hmap[+g.k[0]] = g.m[0]; mx = Math.max(mx, g.m[0]); });
  var cells = '<div class="heat"><span></span>'; for (var i = 0; i < 24; i++) cells += '<span style="text-align:center">' + (i % 6 === 0 ? i : '') + '</span>';
  cells += '<span>Sess.</span>'; for (i = 0; i < 24; i++) { var v = hmap[i] || 0; cells += '<div title="' + i + ':00 — ' + v + '" style="background:rgba(34,211,238,' + (0.08 + 0.92 * v / mx).toFixed(2) + ')"></div>'; }
  h += '<div class="card"><h2>Time of day (property timezone)</h2>' + cells + '</div></div><p class="note">Each cell is one hour. Darker means more sessions.</p>';
  return h;
};
view.Search = function () {
  var ok = Object.keys(D.search).filter(function (s) { return D.search[s].ok; }), bad = Object.keys(D.search).filter(function (s) { return !D.search[s].ok; });
  if (!state.gsc || !D.search[state.gsc] || !D.search[state.gsc].ok) state.gsc = ok[0];
  var h = '<div style="margin:12px 0"><select id="gscsite">' + ok.map(function (s) { return '<option value="' + esc(s) + '"' + (s === state.gsc ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select></div>';
  var s = D.search[state.gsc];
  if (!s) return h + '<div class="empty">No Search Console property is readable yet.</div>';
  var t = s.total || [0, 0, 0, 0];
  h += '<div class="grid">' + card('Clicks', n(t[0])) + card('Impressions', n(t[1])) + card('CTR', t[2] + '%') + card('Avg position', t[3]) + '</div>';
  h += '<div class="cols">' + lineChart([{ name: 'Impressions', pts: s.daily.map(function (r) { return [r[0].replace(/-/g, ''), r[2]]; }) }], { title: 'Impressions per day' }) +
    lineChart([{ name: 'Clicks', pts: s.daily.map(function (r) { return [r[0].replace(/-/g, ''), r[1]]; }) }], { title: 'Clicks per day' }) +
    table('Top queries', ['Query', 'Clicks', 'Impr.', 'CTR %', 'Position'], s.queries, { bar: 2, max: 20 }) +
    table('Top pages', ['Page', 'Clicks', 'Impr.', 'CTR %', 'Position'], s.pages, { bar: 2, max: 20 }) +
    table('Query on page', ['Query', 'Page', 'Clicks', 'Impr.', 'Position'], s.queryPage.map(function (r) { return [r[0], r[1], r[2], r[3], r[5]]; }), { bar: 3, max: 15 }) +
    table('Countries', ['Country', 'Clicks', 'Impr.', 'CTR %', 'Position'], s.countries, { bar: 2, max: 10 }) +
    table('Devices', ['Device', 'Clicks', 'Impr.', 'CTR %', 'Position'], s.devices, { bar: 2 }) + '</div>';
  if (bad.length) h += '<p class="note">Not readable yet (add gsc-readonly@streameros-dashboard.iam.gserviceaccount.com as a user on each in Search Console): ' + bad.map(esc).join(', ') + '</p>';
  return h;
};
view.Realtime = function () {
  var r = rep('rtStreams'), h = '<div class="cols">';
  h += table('Live by site (last 30 minutes)', ['Site', 'Users', 'Views', 'Events'], r.rows.map(function (x) { return [STREAMS[x[0]] || x[0], x[1], x[2], x[3]]; }), { empty: 'Nobody on any site right now.' });
  h += table('Live pages', ['Page', 'Site', 'Users'], rep('rtPages').rows.map(function (x) { return [x[1], STREAMS[x[0]] || x[0], x[2]]; }), { empty: 'Nothing right now.' });
  h += table('Live countries', ['Country', 'Users'], rep('rtCountries').rows.map(function (x) { return [x[0] || '(unknown)', x[1]]; }), { empty: 'Nothing right now.' });
  return h + '</div><p class="note">A snapshot from the last refresh, not a live feed.</p>';
};
view.Tools = function () {
  var sites = Object.keys(SITES), h = '<div class="cols"><div class="card"><h2>UTM link builder</h2><p class="note">Add this to any link you share, so the dashboard can tell the channel and post apart.</p>' +
    '<div class="field"><label>Page URL</label><input id="u-url" value="https://campus.streamerosai.com/"></div>' +
    '<div class="field"><label>Source (where it is posted)</label><input id="u-src" value="whatsapp" placeholder="whatsapp, linkedin, reddit"></div>' +
    '<div class="field"><label>Medium (type)</label><select id="u-med"><option>social</option><option>community</option><option>email</option><option>referral</option><option>cpc</option><option>qr</option></select></div>' +
    '<div class="field"><label>Campaign (name)</label><input id="u-cam" value="final-year-launch"></div>' +
    '<div class="field"><label>Content (optional, which post or button)</label><input id="u-con"></div>' +
    '<div class="field"><label>Result</label><code id="u-out"></code></div><button id="u-copy">Copy link</button></div>';
  h += '<div class="card"><h2>What is tracked</h2><table><thead><tr><th>Event</th><th>Fires when</th></tr></thead><tbody>' + [
    ['page_view', 'Any page opens (automatic)'], ['generate_lead', 'A form or sign-up is sent successfully (contact, enquiry, waitlist, pre-register, FitRank lead)'],
    ['whatsapp_click', 'Someone taps any WhatsApp link'], ['email_click', 'Someone taps an email link'], ['phone_click', 'Someone taps a phone number'],
    ['app_download', 'An APK or iOS file link is tapped'], ['template_download', 'A template (.md) download link is tapped'], ['file_download', 'A PDF, Excel or other document is downloaded (GA4 automatic)'],
    ['agreement_signed', 'A project agreement form is completed'], ['calculator_use', 'Someone first uses a SpotAI calculator'], ['read_depth', 'A blog post is read to 25, 50, 75 or 100 percent'],
    ['click', 'A link to another site is clicked (GA4 automatic)'], ['scroll', 'A page is scrolled to 90 percent (GA4 automatic)']].map(function (r) { return '<tr><td><code>' + r[0] + '</code></td><td style="text-align:left">' + esc(r[1]) + '</td></tr>'; }).join('') + '</tbody></table>' +
    '<p class="note">Every key event also carries first_source, first_medium and first_campaign: where that person first arrived from.</p></div></div>';
  h += '<div class="card" style="margin-top:12px"><h2>Data and freshness</h2><p>Generated <b>' + esc(D.generatedAt) + '</b> from GA4 property ' + esc(D.property) + '. The page rebuilds every 6 hours.</p>' +
    (D.errors.length ? '<p class="note" style="color:var(--warn)">API warnings:<br>' + D.errors.map(esc).join('<br>') + '</p>' : '<p class="note">No API warnings.</p>') +
    '<p class="note">Sites: ' + sites.map(function (s) { return esc(label(s)) + ' (' + esc(s) + ')'; }).join(', ') + '</p></div>';
  return h;
};

// ---- render ---------------------------------------------------------------------
function render() {
  $('main').innerHTML = view[state.tab]();
  document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('on', b.textContent === state.tab); });
  if (state.tab === 'Tools') bindTools();
  var g = $('gscsite'); if (g) g.onchange = function () { state.gsc = g.value; render(); };
}
function bindTools() {
  function upd() {
    try {
      var u = new URL($('u-url').value); var q = { utm_source: $('u-src').value, utm_medium: $('u-med').value, utm_campaign: $('u-cam').value, utm_content: $('u-con').value };
      Object.keys(q).forEach(function (k) { if (q[k]) u.searchParams.set(k, q[k].trim().toLowerCase().replace(/\s+/g, '-')); });
      $('u-out').textContent = u.href;
    } catch (e) { $('u-out').textContent = 'Enter a full URL starting with https://'; }
  }
  ['u-url', 'u-src', 'u-med', 'u-cam', 'u-con'].forEach(function (id) { $(id).oninput = upd; $(id).onchange = upd; });
  $('u-copy').onclick = function () { navigator.clipboard && navigator.clipboard.writeText($('u-out').textContent); };
  upd();
}
document.addEventListener('click', function (e) {
  var id = e.target.getAttribute && e.target.getAttribute('data-more');
  if (id) { document.querySelectorAll('[data-x="' + id + '"]').forEach(function (r) { r.classList.remove('hidden'); }); e.target.remove(); }
});
function start() {
  $('lock').classList.add('hidden'); $('app').classList.remove('hidden');
  var sel = $('site'); sel.innerHTML = '<option value="all">All sites</option>' + Object.keys(SITES).map(function (h) { return '<option value="' + h + '">' + esc(SITES[h]) + '</option>'; }).join('');
  sel.onchange = function () { state.site = sel.value; render(); };
  $('tabs').innerHTML = TABS.map(function (t) { return '<button>' + t + '</button>'; }).join('');
  $('tabs').onclick = function (e) { if (e.target.tagName === 'BUTTON') { state.tab = e.target.textContent; render(); } };
  $('stamp').textContent = 'Updated ' + new Date(D.generatedAt).toLocaleString();
  render();
}
async function unlock(pass) {
  try { D = await decrypt(pass); try { sessionStorage.setItem('ap', pass); } catch (e) {} start(); return true; }
  catch (e) { $('lockerr').textContent = e && e.name === 'OperationError' ? 'Wrong passphrase.' : 'Could not load the data yet. Try again in a few minutes.'; return false; }
}
$('lockform').onsubmit = function (e) { e.preventDefault(); unlock($('pass').value); };
try { var saved = sessionStorage.getItem('ap'); if (saved) unlock(saved); } catch (e) {}
})();
</script>
