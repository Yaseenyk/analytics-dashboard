# analytics-api: live GA4 + Search Console data for analytics.streamerosai.com (free plan is enough).
# Secret: GA_SERVICE_ACCOUNT_JSON (set with `wrangler secret put GA_SERVICE_ACCOUNT_JSON`).
name = "analytics-api"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Job state for the index-health check (see src/index.js). A cron tick every minute does the next small batch.
[[kv_namespaces]]
binding = "DATA"
id = "a467a4af3f19495586015857861420f1"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
