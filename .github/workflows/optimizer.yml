name: Content optimizer

# Weekly: up to 5 pages per site that rank low or are not indexed (never a page already in the top 3), one measured
# change each as a pull request in that site's repo, and a verdict on last month's changes from Search Console.
# It never pushes content to main. Without OPTIMIZER_GITHUB_TOKEN it only writes reports.
on:
  schedule:
    - cron: "30 3 * * 1" # Mondays 03:30 UTC (09:00 IST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only, no pull requests"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: optimizer
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Propose and judge
        run: node scripts/optimizer.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          OPTIMIZER_GITHUB_TOKEN: ${{ secrets.OPTIMIZER_GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # Indexed sites are frozen until this date (no pull requests before it; reports still run).
          FREEZE_UNTIL: "2026-11-18"
          MAX_CHANGES: "40"
          MAX_PER_SITE: "5"
      - name: Save experiments, learnings and the report
        run: |
          git config user.name "analytics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add optimizer data/optimizer.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(optimizer): weekly run"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
