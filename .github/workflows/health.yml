name: Index health

# Once a day: ask Google whether each page of each site is indexed, and commit the result.
# The dashboard build publishes data/health.json with everything else.
on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect every sitemap URL
        run: node scripts/health.mjs
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/health.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: index health $(date -u +%F)"
            git pull --rebase
            git push
          fi
