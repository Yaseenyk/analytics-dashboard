name: Build analytics dashboard

on:
  schedule:
    - cron: "11 */2 * * *" # every 2 hours, off the top of the hour when GitHub delays runs
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Pull GA4 and Search Console
        timeout-minutes: 15
        run: node scripts/build.mjs
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
      - name: Install and build the Next.js app
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm test
          npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 420000
        continue-on-error: true
      # GitHub's Pages backend sometimes accepts a deployment and never finishes it (4 Nov 2026: the same commit
      # failed four times, then published with no change). Retry once, after the first attempt has fully aborted,
      # instead of waiting for someone to re-run the job by hand.
      - name: Wait for the first attempt to finish aborting
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - name: Retry the deployment once
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 420000
