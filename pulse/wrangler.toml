# pulse: our own visit tracker (free plan). Browser script at /p.js, receiver at /e, reads at /v/*.
# Database: `wrangler d1 execute site-pulse --remote --file=schema.sql` (once).
# Optional secret that unlocks the one-by-one views: `wrangler secret put PULSE_KEY`.
name = "pulse"
main = "src/index.js"
compatibility_date = "2026-06-01"

[[d1_databases]]
binding = "DB"
database_name = "site-pulse"
database_id = "5e096572-927d-4f8b-bcdf-fe206936d8fb"

# The esports app's own database, read only (SELECT queries in src/esports.js), so the dashboard can show its
# sign-ups and the feedback people send from inside the app. Nothing in this Worker writes to it.
[[d1_databases]]
binding = "ESPORTS_DB"
database_name = "esports-db"
database_id = "440646ae-544f-492d-86bc-9a071d883607"

[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true
